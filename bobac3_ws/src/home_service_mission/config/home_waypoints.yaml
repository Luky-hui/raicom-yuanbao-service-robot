navigation:
  action_server: /move_base
  fallback_action_server: /move_base_node
  server_wait: 120.0
  goal_timeout: 120.0
  return_to_start: true

interaction:
  face_topic: /face_detection
  command_topic: /service_group_mission/voice_command
  intent_topic: /local_voice/intent
  tts_service: /voice_tts
  wake_prompt: "你好，需要帮助吗？"
  accept: "好的，请跟我来。"

guide:
  trigger_phrases:
    - "可以带我参观一下吗"
    - "带我参观一下"
  route:
    - restaurant
    - kitchen
    - living_room
    - bedroom
  introductions:
    restaurant: "这里是餐厅，是用餐和交流的区域。"
    kitchen: "这里是厨房，是准备和烹饪食物的区域。"
    living_room: "这里是客厅，是休息和接待来访者的区域。"
    bedroom: "这里是卧室，是睡眠和休息的区域。"

assistant:
  trigger_phrases:
    - "给我推荐一下今天适合做什么菜"
    - "去看看冰箱里有什么"
    - "看下还剩什么菜"
